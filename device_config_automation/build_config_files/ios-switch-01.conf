! Generated from Nautobot config context and inventory host variables
! Device: ios-switch-01
! Tags: access, site-1, offen
!
hostname ios-switch-01
no ip domain lookup
ip domain name example.net
enable secret IOS_ENABLE_SECRET
service password-encryption
ip ssh version 2
!
username netadmin privilege 15 secret LOKALES_IOS_BENUTZER_SECRET
vlan 100
 name offen
vlan 10
 name USERS
vlan 20
 name VOICE
interface range GigabitEthernet1/0/1 - 23 description User access ports
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface GigabitEthernet1/0/24 description Uplink
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 no shutdown
!
snmp-server location Site 1
snmp-server contact network-ops@example.net
snmp-server community SNMP_READ_ONLY_COMMUNITY RO
ntp server 192.0.2.20
!
end