Aufgabe: Auf Cisco Switches soll für den localen username "admin" ein neues Passwort vergeben werden. In einem zweiten Schritt sollen die TACACS Keys der in den Network Device Groups enthaltenen Network Devices neu gesetzt werden.

Softwareumgebung:
- alle Switche in im Programm Nautobot gelistet.
- Auf die Switche loggt man sich per TACACS User ein. Dazu meldet sich der Switch bei dem Programm Cisco ISE und prüft, ob der TACACS USER, welcher sich über SSH mit dem Switch verbindet, berechtigt ist, sich einzuloggen.
- Cisco ISE: Die TACACS Keys sind als Network Devices konfigiriert. Die Network Devices sind in Network Device Groups zugeordnet. 
ISE: Beispielkonfiguration: 
Network Devices: Name: Internet Berlin  , IP-Adresse: 10.1.1.0/24 TACACS Passwort: berlin
Network Devices: Name: Internet Sachsen  , IP-Adresse: 10.1.2.0/24 TACACS Passwort: dresden

Network Device Groups: Name: Internet  -> Internet Berlin, Internet Sachsen

-Vault-Datei "internet_vault.yaml" : in dieser Datei sind die neuen Passwörter und neuen TACACS Keys

Network_Device_Group="Internet"
username_passwort="Hausaufgaben2026"
TACACS_Key="Bundesland"

Durchführung:
Ansible_playbook 0: Finde alle Cisco Switche, welche zur Network Device Group= Internet gehören. Nimm dazu die konfigurierten IP Adressen aus den ISE Network Device Group zugeordneten Network Devices. Nimm nun die diese IP-Adressen und finde alle Devices in Nautobot, welche mit Primary IP in dem Range liegen. 
Beispiel:
Network Devices: Name: Internet Berlin  , IP-Adresse: 10.1.1.0/24 
Wenn in Nautobot Device die IP 10.1.1.1 hat, dann ist das ein Treffer.
Erzeuge eine hosts-Datei hosts_%Name der Network Device Group%.ini .  
Struktur der hosts Datei: "Nautobot_device_hostname"[FQDN] ansible_host=%Primary_IP%
     
Ansible-playbook 1: Ändere für die Cisco Switche der Network Device Group Name= Internet (Siehe im Step "Ansible_playbook 0" erzeugte hosts-Datei) die username Passwörter. Zu finden in der vault-Datei "internet_vault.yaml" .

Erstelle einen Prompt für eine KI-Vibecoding Agenten, der diese Anweisungen enthält.

Frage mich, wenn etwas unklar ist, bzw. wenn du zusätzliche Fragen hast.

Rückfragen zur Klärung:
TACACS-Key-Update (Schritt 2)
Der neue TACACS-Key (TACACS_Key="Bundesland") auf den Cisco-Switches selbst (globaler tacacs server Key) geändert werden? Der neue Key wird vorher manuell in den Network Devices ind er ISE eingetragen. Hierbei wird die Retire Funktion benutzt, da dann sowohl der neue und er alte Key gültig sind. Erste wenn alle Devices den neuen Key haben, wird der "retire" Key gelöscht, sodass nur noch der neue Key gültig ist. 

API-Zugriff & Collections: Zugriff Ansible-Collections bevorzugst du für den Zugriff auf Cisco ISE (HTTP API) und Nautobot (REST API)!

Authentifizierung für APIs: Die Zugangsdaten für die Cisco ISE API und die Nautobot API ebenfalls in der Vault-Datei enthalten.


###################################################################################

Vollständige Anleitung für den KI-Vibecoding-Agenten

    Rolle: Du bist ein Senior Network Automation Engineer und KI-Vibecoding-Agent. Du erstellst eine robuste, produktionsreife Ansible-Automatisierungslösung zur Verwaltung von Cisco-Switches über Cisco ISE (ERS/HTTP-API) und Nautobot (REST-API).

    Architektur-Übersicht:

        Vault: Zentrale Speicherung aller Passwörter, API-Tokens und Schlüssel in internet_vault.yaml.

        Playbook 0 (Discovery & Inventar): Abfrage der Cisco ISE über HTTP-API nach Network Devices einer Device Group, Abgleich mit Nautobot (REST-API) über IP-Ranges und Generierung einer dynamischen Ansible-Inventar-Datei (hosts_Internet.ini).

        Playbook 1 (Admin-Passwort-Update): Ändern des lokalen admin-Passworts auf den Switches.

        Playbook 2 (TACACS-Key-Update): Aktualisieren des globalen TACACS-Shared-Secrets auf den Switches (nachdem in der ISE der neue Key bereits per "Retire"-Funktion parallel aktiv ist).

1. Struktur der Vault-Datei (internet_vault.yaml)

Die Vault-Datei enthält alle sensiblen Daten, API-Endpunkte und Steuerungsvariablen:
YAML

---
network_device_group: "Internet"
username_passwort: "Hausaufgaben2026"
TACACS_Key: "Bundesland"

# API Zugangsdaten & Endpunkte
ise_base_url: "https://ise.yourdomain.local:9060"
ise_username: "api_admin_user"
ise_password: "secure_ise_password"

nautobot_base_url: "https://nautobot.yourdomain.local"
nautobot_token: "nautobot_api_token_here"

2. Playbook 0: Dynamische Inventarerstellung (build_inventory.yml)

Dieses Playbook ruft die Cisco ISE ab, filtert die Devices der Gruppe Internet, extrahiert deren IP-Adressen/Netzwerke, gleicht diese mit Nautobot ab und generiert die Datei hosts_Internet.ini.
Workflow & Logik:

    ISE ERS API abfragen: GET /ers/config/networkdevice (bzw. über Filterung der Device Groups).

    IP-Subnetze/Adressen extrahieren: Jedes Network Device in der ISE liefert eine IP-Adresse oder ein Subnetz (z. B. 10.1.1.0/24).

    Nautobot REST API abfragen: GET /api/dcim/ip-addresses/ (oder Geräte-Abfrage), um zu prüfen, welche Nautobot-Devices (Hostnames und Primary IPs) in diesen IP-Bereichen liegen.

    INI-File generieren: Nutze das template-Modul oder copy mit Jinja2-Template, um hosts_Internet.ini im Format Hostname ansible_host=IP zu erzeugen.

Beispiel-Struktur der generierten hosts_Internet.ini:
Ini, TOML

[internet_switches]
sw-berlin-01.domain.local ansible_host=10.1.1.1
sw-sachsen-01.domain.local ansible_host=10.1.2.5

3. Playbook 1: Lokales Admin-Passwort aktualisieren (update_admin_password.yml)

    Inventar: Nutzt die in Playbook 0 erzeugte hosts_Internet.ini.

    Verbindung: SSH (unter Verwendung des bestehenden TACACS-Users und dessen Zugangsdaten).

    Aufgabe: Aktualisierung des lokalen Benutzers admin.

Ansible Tasks Snippet:
YAML

- name: Update local admin user password on Cisco switches
  hosts: internet_switches
  gather_facts: false
  vars_files:
    - internet_vault.yaml
  tasks:
    - name: Set local admin password
      cisco.ios.ios_user:
        name: admin
        password: "{{ username_passwort }}"
        state: present
      register: user_update

4. Playbook 2: TACACS-Key auf Switches aktualisieren (update_tacacs_key.yml)

    Hintergrund: Der neue TACACS-Key (TACACS_Key="Bundesland") wurde zuvor bereits manuell in der Cisco ISE über die "Retire"-Funktion hinterlegt (sodass aktuell sowohl der alte als auch der neue Key in der ISE gültig sind). Nun wird der Key auf den Switches angepasst.

    Aufgabe: Konfiguration des neuen TACACS-Keys auf den Cisco-Switches (globaler TACACS-Server-Key).

Ansible Tasks Snippet (Cisco IOS):
YAML

- name: Update TACACS server key on Cisco switches
  hosts: internet_switches
  gather_facts: false
  vars_files:
    - internet_vault.yaml
  tasks:
    - name: Configure global TACACS key (or named tacacs server)
      cisco.ios.ios_config:
        lines:
          - tacacs-server key 0 {{ TACACS_Key }}
        # Alternativ bei moderner TACACS-Server-Group-Syntax:
        # - tacacs server ISE_CLUSTER
        # - key 0 {{ TACACS_Key }}
      save_when: modified

(Hinweis für den Agenten: Je nach IOS-Version/Modell kann die Syntax von tacacs-server key zu modernem tacacs server <name> variieren. Der Agent soll hier eine flexible oder modulare Konfiguration bereitstellen).
5. Erforderliche Deliverables des Agenten

Der KI-Vibecoding-Agent soll für diese Anforderungen folgenden Code vollautomatisch generieren:

    internet_vault.yaml (Template mit Platzhaltern).

    playbook_0_discovery.yml (Inklusive HTTP-Requests an ISE ERS API und Nautobot REST API mittels ansible.builtin.uri).

    playbook_1_password.yml (Cisco IOS Lokales Passwort-Update).

    playbook_2_tacacs.yml (Cisco IOS TACACS-Key-Update).

    Eine README.md mit einer kurzen Anleitung zur Ausführung (ansible-playbook).
