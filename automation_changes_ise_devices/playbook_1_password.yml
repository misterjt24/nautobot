---
- name: Update local admin password on discovered Internet switches
  hosts: internet_switches
  gather_facts: false
  vars_files:
    - internet_vault.yaml
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_user: "{{ switch_username }}"
    ansible_password: "{{ switch_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ switch_enable_password }}"
  tasks:
    - name: Set local admin user password
      cisco.ios.ios_user:
        name: admin
        password: "{{ username_passwort }}"
        update_password: always
        state: present
      no_log: true
      